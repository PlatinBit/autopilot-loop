# Beispiel: Java/Gradle-Projekt (so läuft es bei der Minecraft-Mod „Rise of Realms“, für die das Werkzeug entstand).
# Die reine Logik liegt in einem Paket ohne Minecraft-Abhängigkeit und wird über einen eigenen Haupt-Einstieg
# geprüft, der „PRUEFUNGEN: N bestanden“ ausgibt; der Abnahmetest liegt in einem eigenen Gradle-Quellordner.
NAME=meine-mod
ARBEITSORDNER=../meine-mod-autopilot     # git worktree add ../meine-mod-autopilot -b autopilot
BASIS_ZWEIG=master
AUFGABEN=TASKS.md

PRUEFEN='./gradlew build pruefen -q'
PRUEF_ZAHL='^PRUEFUNGEN: ([0-9]+) bestanden$'

ABNAHME='./gradlew abnahme -q'
ABNAHME_ZAHL='^ABNAHME: ([0-9]+) von ([0-9]+)$'
ABNAHME_DATEIEN=(src/abnahme)
BEDINGUNGEN="grep -rho 'bedingung(\"[^\"]*\"' src/abnahme | sed 's/bedingung(\"//; s/\"\$//'"

ERLAUBT='^(src/main/java/de/beispiel/mod/logik/|src/main/resources/mod/|TASKS\.md$|BLOCKED\.md$|ENTSCHEIDUNGEN\.md$)'
VERBOTEN_INHALT='^import (static )?(net\.minecraft|net\.neoforged|com\.mojang)'

UMSETZER_WERKZEUGE=(Read Edit Write Glob Grep 'Bash(./gradlew:*)')

# Benachrichtigung per Mail-Skript (Beispiel)
#benachrichtigen() { mein-mail-skript "$1" "Autopilot $NAME" "$2"; }
