# autopilot-loop – project configuration (read by Bash, i.e. executed like a script).
# `autopilot plan <file>` writes one for you; this file documents every setting for writing one by hand.
# Relative paths start from the directory of this file. State, logs and costs go to ./.autopilot/
# After every change: `autopilot trust` – until then the file is not loaded, for security reasons.
# Only TEST_CMD and DEMO_CMD are required; everything else shows its default.

# Required: command that builds and tests (in the work directory). Exit code 0 = green.
# Its output must contain a line from which TEST_COUNT_REGEX reads the number of passed tests.
# This number must never drop, and every ticked-off task must raise it (unless the task names its own check
# command: "Done when `<command>` …", then that command must exit 0 instead).
TEST_CMD='pytest -q'
# Required in practice: one command that starts or uses the finished result the way you would, exit 0 = it
# works (same time limit and sandbox as TEST_CMD). Only a green demo makes the result "delivered"; without
# it the start is only warned about and every end is "not delivered: no demo".
DEMO_CMD=''                 # e.g. 'python app.py --help', './bin/tool examples/a.md'

TEST_COUNT_REGEX='([0-9]+) passed'   # pytest; the default is '^TESTS: ([0-9]+)'
# Without a summary line: TEST_COUNT_CMD gets the output on stdin and prints only the number (replaces TEST_COUNT_REGEX).
# Examples: Go   TEST_CMD='go test -v ./...'  TEST_COUNT_CMD='grep -c -- "--- PASS"'
#           Rust TEST_CMD='cargo test'        TEST_COUNT_CMD='grep -o "[0-9]* passed" | awk "{s+=\$1} END {print s}"'
#           Jest/Vitest TEST_COUNT_REGEX='Tests:? +([0-9]+) passed'   Maven TEST_COUNT_REGEX='Tests run: ([0-9]+)'
#           .NET TEST_COUNT_REGEX='Passed: +([0-9]+)'   PHPUnit TEST_COUNT_REGEX='OK \(([0-9]+) tests?'   RSpec TEST_COUNT_REGEX='([0-9]+) examples?, 0 failures'
#TEST_COUNT_CMD=''
#TEST_EMPTY_RC=''           # exit code of TEST_CMD that means "0 tests", not red (pytest without tests: 5)
#TEST_TIMEOUT=30m           # time limit for TEST_CMD, ACCEPT_CMD and DEMO_CMD (each call)
#TRY_IT=''                  # for the handover: how you try the result by hand, relative to the work directory

# Where Claude works: a Git work directory, best a separate worktree on its own branch
# (git worktree add ../myproject-autopilot -b autopilot), so your own working copy stays untouched.
#WORKDIR=.
#BASE_BRANCH=''             # what the work is compared with; empty: the branch of the project's main worktree
#NAME=<folder of this file> # project name in the status line and the tmux session
#TASKS_FILE=TASKS.md        # task list in the work directory: lines "- [ ] …", each with "Done when …" (see templates/TASKS.md)
#DECISIONS_FILE=DECISIONS.md
#PLAN_FILE=''               # plan being implemented: given to the planner (and to the worker when there is no brief)
#LOCKED=()                  # paths that must never change: the plan, the acceptance test files

# Paths Claude may change (extended regular expression on file paths in the work directory). The task list,
# BLOCKED.md and DECISIONS_FILE are always allowed. Empty: everything except the files that control the test
# command (package.json, pyproject.toml, pytest.ini, setup.cfg, tox.ini, noxfile.py, conftest.py, jest.config.*,
# vitest.config.*, build.gradle*, settings.gradle*, gradle.properties, gradlew, gradle/wrapper/*, mvnw, Cargo.toml,
# go.mod, Makefile, *.csproj, pom.xml) and the script TEST_CMD, ACCEPT_CMD or DEMO_CMD starts when its first
# word is a file in the work directory (e.g. ./run-tests.sh).
# Always locked, whatever is written here: .git*, .github/, .claude/, .autopilot/, autopilot.conf, CLAUDE.md, LOCKED.
#ALLOWED=''                 # e.g. '^(src/|tests/)'
#FORBIDDEN_CONTENT=''       # pattern for lines that must never be added (e.g. forbidden imports)
#SECRETS_CHECK=on           # reject added lines that look like secrets (AWS keys, private key blocks, a long literal
                            # assigned to a name ending in password/secret/token/api_key); off for false alarms

# Optional: acceptance test = goal of the whole project. It may be red, but the number of met conditions
# must never drop. Put its files into LOCKED.
#ACCEPT_CMD=''              # e.g. 'python accept.py'
#ACCEPT_REGEX='^ACCEPT: ([0-9]+) of ([0-9]+)'

# Models: balanced (worker sonnet, reviewer sonnet, planner opus), max (all opus),
# cheap (worker haiku, reviewer sonnet, planner sonnet). Only with cheap the planner writes a brief for every
# task; otherwise the worker reads the plan and the code itself. Planner, final review and lessons use the planner model.
#MODELS=balanced

# Caps and brakes (each may also come from the environment, e.g. MAX_RUNS=3 autopilot.sh)
#MAX_RUNS=50                # runs per start
#MAX_COST_USD=20            # cost of all Claude calls per start (with a subscription a notional value)
#ATTEMPTS=3                 # failed attempts per task (script rejection, reviewer no, time limit), then it is blocked
#MAX_BLOCKED=3              # blocked tasks, then the loop stops
#NO_PROGRESS=10             # accepted runs without a higher acceptance count end the loop; a planner round
                            # counts as half of it, so two rounds without progress end it too
#PLANNER=on                 # list empty but goal open: propose new tasks (adopted with `autopilot plan accept`)

# The end: after the demo a final review (planner model) reads the whole change; then TEST_CMD and DEMO_CMD run
# once more in a fresh checkout of HEAD; only then is the result delivered and merged.
#FRESH_CHECK=on             # off: skip the fresh checkout (for a demo bound to a fixed place, e.g. a test server).
                            # The start runs TEST_CMD there once and refuses to start when it is red. A fresh checkout
                            # has no ignored files (node_modules/, .venv/, build caches) and with the sandbox no network
                            # to fetch them: a TEST_CMD that needs them is red there – then FRESH_CHECK=off.
#MERGE=ff                   # delivered: fast-forward BASE_BRANCH in the project's main worktree when it is on that
                            # branch, clean and a fast-forward is possible; off = never, you merge yourself

# Sandbox (Linux, bubblewrap): test, acceptance and demo command run without network and devices, read-only
# outside WORKDIR (and with a read-only .git) – automatically when bwrap works here. It covers only the commands
# this script runs; the worker's own Bash calls are NOT sandboxed unless you route them through the bundled
# sandbox-run (`autopilot plan accept` does that by itself), e.g.:
#   WORKER_TOOLS=(Read Edit Write Glob Grep 'Bash(<plugin directory>/sandbox-run pytest:*)')
# Note: HOME is read-only too, so tools that write caches there (Gradle, npm) need them inside WORKDIR.
#SANDBOX=''                 # off = never

# Worker tools (Claude Code --allowedTools). Allow only what is needed, no Git.
WORKER_TOOLS=(Read Edit Write Glob Grep 'Bash(pytest:*)')

# Optional: your own prompts instead of the templates
#PROMPT_FILE=PROMPT.md
#REVIEWER_FILE=REVIEWER.md
#PLANNER_FILE=PLANNER.md
#BRIEF_FILE=BRIEF.md

# Optional: notification on start, end and warnings. $1 = ok|info|warn|crit, $2 = text.
# Default: a desktop notification via notify-send when it exists, silent otherwise. Define notify() here
# to replace it, e.g. mail:
#notify() { mail -s "Autopilot $NAME: $1" you@example.org <<<"$2"; }
