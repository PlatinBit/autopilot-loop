# autopilot-loop – project configuration (read by Bash, i.e. executed like a script).
# Relative paths start from the directory of this file. State, logs and approval go to ./.autopilot/
# After every change: `autopilot trust` – until then the file is not loaded, for security reasons.

# Project name (tmux session "autopilot-<NAME>", menu title)
NAME=myproject

# Git work directory in which Claude works. Recommended: a separate worktree on its own branch,
#   git worktree add ../myproject-autopilot -b autopilot
# so that your own working copy stays untouched. Adopt the result later with `git merge autopilot`.
WORKDIR=.
BASE_BRANCH=main            # what "View result" shows the new commits against

# Task list in the work directory: lines "- [ ] …", each with "Done when …"
TASKS_FILE=TASKS.md
# Where the worker notes its small decisions (one line each)
DECISIONS_FILE=DECISIONS.md

# Required: command that builds and tests (in the work directory). Exit code 0 = green.
# Its output must contain a line from which TEST_COUNT_REGEX reads the number of passed tests.
# This number must never drop, and every ticked-off task must raise it.
TEST_CMD='pytest -q'
TEST_COUNT_REGEX='([0-9]+) passed'
# Without a summary line: TEST_COUNT_CMD gets the output on stdin and prints only the number (replaces TEST_COUNT_REGEX).
# Examples: Go   TEST_CMD='go test -v ./...'  TEST_COUNT_CMD='grep -c -- "--- PASS"'
#           Rust TEST_CMD='cargo test'        TEST_COUNT_CMD='grep -o "[0-9]* passed" | awk "{s+=\$1} END {print s}"'
#           Jest/Vitest TEST_COUNT_REGEX='Tests:? +([0-9]+) passed'   Maven TEST_COUNT_REGEX='Tests run: ([0-9]+)'
#           .NET TEST_COUNT_REGEX='Passed: +([0-9]+)'   PHPUnit TEST_COUNT_REGEX='OK \(([0-9]+) tests?'   RSpec TEST_COUNT_REGEX='([0-9]+) examples?, 0 failures'
TEST_COUNT_CMD=''

# Optional: acceptance test = goal of the whole project. It may be red, but the number of met conditions
# must never drop. Its files are locked: approve them before the first start (menu or
# `autopilot approve`); afterwards the script rejects every run that changes them.
ACCEPT_CMD=''               # e.g. 'python accept.py'
ACCEPT_REGEX='^ACCEPT: ([0-9]+) of ([0-9]+)'
ACCEPT_FILES=()             # e.g. (accept.py)
ACCEPT_LIST_CMD=''          # optional: command that lists the conditions readably (for the approval)

# Required: paths Claude may change (extended regular expression on file paths in the work directory).
# The task list, BLOCKED.md and DECISIONS_FILE must be included, the acceptance files must not.
# Always locked, whatever is written here: .git*, .github/, .claude/, .autopilot/, autopilot.conf, CLAUDE.md.
# Tip: do not allow files that control the test command (package.json, pytest.ini, build.gradle …).
ALLOWED='^(src/|tests/|TASKS\.md$|BLOCKED\.md$|DECISIONS\.md$)'

# Optional: pattern for lines that must never be added (e.g. forbidden imports)
FORBIDDEN_CONTENT=''

# Worker tools (Claude Code --allowedTools). Allow only what is needed, no Git.
WORKER_TOOLS=(Read Edit Write Glob Grep 'Bash(pytest:*)')

# Plan being implemented (e.g. README.md): passed to every run, locked for Claude.
# `autopilot plan <file>` fills in both by itself.
PLAN_FILE=''
LOCKED=()                   # further paths that must never change (acceptance files always are)

# Planner: if the list is empty and the acceptance test is not yet met, Claude proposes new tasks
# (they are adopted only with `autopilot suggestion accept`).
PLANNER=on

# Grades: success rate per task kind (kind = [tag] right after the number: "- [ ] 7. [ui] …").
# Licence from LICENCE_MIN_RUNS grades with at least LICENCE_MIN_RATE %, revoked below LICENCE_REVOKE_BELOW %.
# SUPERVISED=on: kinds without a licence wait for `autopilot continue` after every task.
SUPERVISED=off
LICENCE_MIN_RUNS=20
LICENCE_MIN_RATE=95
LICENCE_REVOKE_BELOW=90

# Warn when the acceptance count has not risen for this many accepted runs (0 = off)
STALL_WARN_AFTER=10

# Optional: real test (start a server, drive the app …), every SMOKE_TEST_EVERY accepted runs
# (0 = only at the end). If it produces an image (IMAGE_REVIEW_FILE), the reviewer judges it.
SMOKE_TEST_CMD=''
SMOKE_TEST_EVERY=0
IMAGE_REVIEW_FILE=''
IMAGE_REVIEW_QUESTION='Does the result in the image look coherent and free of errors?'

# Model for `autopilot report` (daily summary)
REPORT_MODEL=haiku

# Optional: your own prompts instead of the templates
#PROMPT_FILE=PROMPT.md
#REVIEWER_FILE=REVIEWER.md
#PLANNER_FILE=PLANNER.md
#BRIEF_FILE=BRIEF.md

# Optional: notification on start, end and abort. $1 = ok|info|warn|crit, $2 = text
#notify() { notify-send "Autopilot $NAME" "$2"; }
