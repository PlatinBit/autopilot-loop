# Example: Java/Gradle project.
# The pure logic lives in a package without framework dependencies and is checked by its own main entry point
# that prints "TESTS: N passed"; the acceptance test lives in its own Gradle source set.
WORKDIR=../my-app-autopilot          # git worktree add ../my-app-autopilot -b autopilot
BASE_BRANCH=master

TEST_CMD='./gradlew build check -q'
TEST_COUNT_REGEX='^TESTS: ([0-9]+) passed$'

# Demo at the end of every loop: uses the result the way the owner would; exit 0 = delivered.
# TRY_IT goes into the handover (.autopilot/HANDOVER.md) as the "how to try it" text.
DEMO_CMD='./gradlew run -q --args="--check examples/sample.txt"'
TRY_IT='Run ./gradlew run --args="examples/sample.txt" and compare the output with examples/sample.expected'

ACCEPT_CMD='./gradlew accept -q'
ACCEPT_REGEX='^ACCEPT: ([0-9]+) of ([0-9]+)$'
LOCKED=(src/accept)                  # the acceptance test must never change

ALLOWED='^(src/main/java/com/example/app/logic/|src/main/resources/app/)'
FORBIDDEN_CONTENT='^import (static )?(javax\.swing|java\.awt)'

WORKER_TOOLS=(Read Edit Write Glob Grep 'Bash(./gradlew:*)')

