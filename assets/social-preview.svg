  <text x="502" y="360" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#c4b5fd">Point it at a plan file.</text>
  <text x="502" y="408" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#c4b5fd">Claude Code builds it task by task –</text>
